name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:     # ручной запуск: пересборка, тесты и переопубликация таблицы

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Full run
        run: python run.py

      - name: Tests
        run: python -m pytest -q

      - name: Committed output is up to date
        run: |
          git diff --stat -- data/out
          git diff --exit-code -- data/out
          untracked=$(git ls-files --others --exclude-standard -- data/out)
          if [ -n "$untracked" ]; then
            echo "Не закоммичены новые файлы выхода:"
            echo "$untracked"
            exit 1
          fi

  # Публикация общего реестра в Google Таблицу: только main (push или ручной запуск) и только если test прошёл.
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: registry-sheet-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish registry to Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REGISTRY_SHEET_ID: ${{ secrets.REGISTRY_SHEET_ID }}
        run: python -m src.publish_sheet
