# Эталон для test_golden.py; сравнение посимвольное.
# Поля — колонки реестра, которые заполняет парсер.
# ~ (null) — поле ещё не заполнено, тест его пропускает. «—» — поле должно быть пустым.
#
# Как заполнен (2026-10-13): текст переписан с изображений страниц (растр скана, без текстового слоя),
# полосы — data/interim/golden_crops/pNN_MM.png. Перенос слова в конце строки склеен без дефиса.
# Поля, которых нет на изображении (id, Область, Тип сущности, Статус, Ссылки для проверки,
# Связанные термины), выведены вручную по правилам задания и решениям шага 0, не из вывода парсера.
# Неоднозначных мест на изображениях не было.
# «X — используется в определении» (2026-10-26): записи стандарта, названные в формулировке статьи, — выведены по тексту.

