# Эталон ГОСТ Р 58624.3-2019 для test_golden.py; сравнение посимвольное.
# ~ (null) — поле не заполнено, тест его пропускает. «—» — поле должно быть пустым.
#
# Как заполнен (2026-10-16): текст переписан с изображений страниц PDF 11–12 (растр скана),
# полосы — data/interim/_recon_73035/crops/p11_01.png, p11_02.png, p11_04.png, p12_01.png.
# Перенос слова в конце строки склеен без дефиса. Сноска «*» у 3.1.8 и сама сноска (стр. 11) в поля не входят.
