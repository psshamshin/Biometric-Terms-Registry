id: bpcer
Переработанное длинное определение: "Показывает, как часто система защиты от атак ошибочно считает атакой честное предъявление живого человека. Считается по подлинным биометрическим предъявлениям в конкретном сценарии: сколько из них классифицировали как предъявления атаки. Пример: 1000 условных подлинных предъявлений, 20 раз система сочла их атакой — BPCER = 2%. Чем ниже значение, тем реже честные пользователи упираются в отказы. Парная метрика — APCER: если ужесточить защиту, APCER обычно падает, но BPCER растёт. Считается по подлинным предъявлениям, а не по атакам."
Короткое определение: "Как часто живого человека принимают за атаку. Ниже — лучше"
Формула *: "BPCER = FN / (FN + TP) = FNR = 1 − TPR"
