id: pai-series
Переработанное длинное определение: "Группа инструментов атаки, сделанных одним способом в одинаковых условиях и от одного источника биометрических характеристик. Пример из стандарта: набор поддельных отпечатков пальцев, изготовленных одинаково из одинаковых материалов, с одинаковыми узорами. В оценке могут быть использованы комплекты из одного или нескольких источников; при нескольких источниках может наблюдаться изменчивость из-за особенностей людей."
Короткое определение: Инструменты атаки одного способа изготовления и одного источника
