id: biometric-enrolment
Переработанное длинное определение: "Действия по созданию и сохранению записи данных биометрической регистрации по правилам биометрической регистрации. Применяется при внесении человека в биометрическую систему. Слово «регистрация» само по себе неоднозначно в обработке сигналов, поэтому в биометрии рекомендуется использовать именно термин «биометрическая регистрация»."
Короткое определение: Внесение человека в биометрическую систему
