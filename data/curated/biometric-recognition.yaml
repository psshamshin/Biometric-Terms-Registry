id: biometric-recognition
Переработанное длинное определение: "Автоматическое распознавание людей по их поведенческим и биологическим характеристикам. Включает биометрическую верификацию и биометрическую идентификацию. «Автоматическое» означает, что система может работать как сама, так и при участии человека. Использовать «аутентификацию» как синоним верификации или идентификации неприемлемо; предпочтителен термин «биометрическое распознавание»."
Короткое определение: Автоматическое распознавание людей по их характеристикам
