Переработанное длинное определение: "Один или несколько хранимых биометрических образцов, шаблонов или моделей, относящихся к субъекту биометрических данных и используемых как объект сравнения. Примеры из стандарта: изображение лица, хранимое в цифровом виде в паспорте; шаблон из контрольных точек отпечатка пальца на идентификационной карте; модель распределения Гаусса для распознавания диктора."
