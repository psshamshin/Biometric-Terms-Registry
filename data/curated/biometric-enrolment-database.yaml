id: biometric-enrolment-database
Переработанное длинное определение: "База данных, состоящая из записей данных биометрических регистраций. Она может включать базу данных биометрических контрольных шаблонов; их разделяют, например, из соображений безопасности или конфиденциальности. База с биометрическими данными, не используемыми как контрольные шаблоны, — биометрическая база данных, но не база регистраций. Один шаблон на карте в некоторых транзакциях может считаться такой базой."
Короткое определение: База записей о зарегистрированных людях
