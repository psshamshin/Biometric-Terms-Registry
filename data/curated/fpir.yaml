id: fpir
Переработанное длинное определение: "Показывает, как часто система при поиске по базе кого-то находит, хотя искомого человека в ней нет. Считается по транзакциям идентификации людей, не зарегистрированных в системе: сколько из них закончились возвратом какого-либо идентификатора. Пример: 1000 условных поисков по базе людей, которых в ней нет, в 10 случаях система всё равно вернула чей-то идентификатор — FPIR = 1%. Зависит от числа зарегистрированных людей и порога принятия решения; если система всегда возвращает фиксированное число кандидатов без порога, показатель не имеет смысла. Парная метрика — FNIR. Не путать с FMR, который считается по непарным сравнениям."
Короткое определение: "Как часто поиск находит того, кого нет"
Формула *: "FPIR = FP / (FP + TN) = FPR = 1 − TNR"
