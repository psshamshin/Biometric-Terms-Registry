id: capnir
Переработанное длинное определение: "Показывает, как часто атака укрывателя личности удаётся при поиске по базе: его идентификатор не оказался среди найденных. Считается по предъявлениям при атаке укрывателя одним видом инструмента атаки: сколько из них не вернули идентификатор укрывателя или, в зависимости от варианта использования, не вернули никакого. Пример: 100 условных предъявлений, 5 раз идентификатор не нашёлся — CAPNIR = 5%. Чем ниже значение, тем лучше защита от сокрытия личности. Относится к идентификации; для верификации есть CAPNMR. Формулу через TP, FP, TN, FN записать нельзя."
Короткое определение: "Как часто поиск не находит укрывателя личности. Ниже — лучше"
