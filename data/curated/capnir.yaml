id: capnir
Переработанное длинное определение: "Показывает, как часто атака укрывателя личности удаётся при поиске по базе: его идентификатор не оказался среди найденных. Считается по предъявлениям при атаке укрывателя одним видом инструмента атаки: сколько из них не вернули идентификатор укрывателя или, в зависимости от варианта использования, не вернули никакого. Пример: 100 условных предъявлений, 5 раз идентификатор не нашёлся — CAPNIR = 5%. Относится к идентификации; для верификации есть вероятность несовпадения предъявления при атаке укрывателя личности (CAPNMR). Для укрывателя несовпадение означает успех атаки."
Короткое определение: "Как часто поиск не находит укрывателя личности"
Формула *: "CAPNIR = TN / (FP + TN) = TNR = 1 − FPR"
