id: iapir
Переработанное длинное определение: "Показывает, как часто атака самозванца проходит при поиске по базе: нужный идентификатор вернулся среди результатов. Считается по предъявлениям при атаке самозванца одним видом инструмента атаки: сколько из них привели к возврату идентификатора биометрического контрольного шаблона или, в зависимости от варианта использования, хотя бы одного идентификатора. Пример: 100 условных предъявлений одной маски, 4 раза идентификатор вернулся — IAPIR = 4%. Относится к идентификации; для верификации есть вероятность совпадения предъявления при атаке самозванца (IAPMR)."
Короткое определение: "Как часто атака самозванца проходит идентификацию"
Формула *: "IAPIR = FP / (FP + TN) = FPR = 1 − TNR"
