id: fmr
Переработанное длинное определение: "Показывает, как часто система принимает чужого человека за своего. Считается по завершённым попыткам непарного сравнения, то есть сравнения образцов разных людей: сколько из них закончились ложным совпадением. Пример: из 1000 условных сравнений образцов разных людей 10 раз система признала их совпадающими — FMR = 1%. Чем ниже значение, тем надёжнее защита от чужих. Значение зависит от порогов, других параметров процесса сравнения и протокола испытаний. Парная метрика — FNMR: она считается по парным сравнениям. Оба источника (2382-37 и 19795-1) считают по попыткам непарного сравнения."
Короткое определение: "Как часто система принимает чужого за своего. Ниже — лучше"
Формула *: "FMR = FP / (FP + TN) = FPR = 1 − TNR"
