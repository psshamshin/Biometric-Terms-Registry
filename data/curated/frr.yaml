Переработанное длинное определение: "Показывает, как часто система ошибочно отклоняет подлинное биометрическое заявление, то есть не пускает человека, который назвался собой честно. Считается по транзакциям с подлинными заявлениями, а не по отдельным сравнениям образцов: сколько из них закончились ошибочным отказом. Пример: в 1000 условных обращений сотрудников 30 раз система отказала — FRR = 3%. Парная метрика — вероятность ложного допуска (FAR): она считается по транзакциям с ложными заявлениями, которые ошибочно приняли."
Короткое определение: "Как часто подлинное заявление ошибочно отклоняют"
Формула *: "FRR = FN / (FN + TP) = FNR = 1 − TPR"
