id: one-to-one-comparison
Переработанное длинное определение: "Процесс, при котором биометрическую пробу (пробы) одного субъекта биометрических данных сравнивают с контрольным шаблоном (шаблонами) одного субъекта, чтобы получить результат сравнения. Некоторым алгоритмам нужно сравнить пробу с шаблонами многих субъектов, но результат всё равно показывает подобие пробы и шаблона одного субъекта, поэтому процесс называется «один к одному»."
Короткое определение: Сравнение пробы одного человека с шаблоном одного человека
