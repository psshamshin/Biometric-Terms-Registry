id: iapar
Переработанное длинное определение: "Показывает, как часто атака самозванца заканчивается допуском. Самозванец — нарушитель, который пытается совпасть с контрольным шаблоном другого человека. Считается по предъявлениям при атаке самозванца с одним видом инструмента атаки (например, одним типом накладки): сколько из них привели к допуску. Пример: 100 условных предъявлений одной накладки, 4 раза система допустила — IAPAR = 4%. Для разных видов инструментов атаки значения считаются отдельно."
Короткое определение: "Как часто атака самозванца приводит к допуску"
Формула *: "IAPAR = FP / (FP + TN) = FPR = 1 − TNR"
