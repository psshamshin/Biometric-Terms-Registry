id: biometric
Переработанное длинное определение: "Имеющий отношение к биометрии. Для английского «biometric» нельзя использовать перевод «биометрика» в значении биометрической характеристики или модальности. Правильно: «Биометрические характеристики моего лица были закодированы в моем паспорте». Неправильно: «Моя лицевая биометрика была закодирована в моем паспорте»."
Короткое определение: Относящийся к биометрии
