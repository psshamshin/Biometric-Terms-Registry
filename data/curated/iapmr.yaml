id: iapmr
Переработанное длинное определение: "Показывает, как часто атака самозванца проходит при проверке «один к одному»: контрольный шаблон совпал. Считается по предъявлениям при атаке самозванца одним видом инструмента атаки: сколько из них система признала совпавшими. Пример: 100 условных предъявлений одной накладки, 3 раза шаблон совпал — IAPMR = 3%. Относится к верификации. Для разных видов атак значения считаются отдельно."
Короткое определение: "Как часто атака самозванца проходит верификацию"
Формула *: "IAPMR = FP / (FP + TN) = FPR = 1 − TNR"
