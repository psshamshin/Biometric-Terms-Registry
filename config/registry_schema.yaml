# Структура реестра терминов по биометрии — общая для всех стандартов.
# Единственный источник ограничений: все проверки читают правила отсюда.
# Изменения колонок, справочников и ограничений — только по согласованию с владельцем реестра.
#
# История согласованных изменений (шаг 0, 2026-10-13):
#   - «Аббревиатура en»: убрано «у метрики оканчивается на R» (признак метрики А расширен, см. classification);
#   - «Наименование ru»: разрешены «» и запятая — наименования из стандарта;
#   - «Связанные термины»: у метрики без пары допускается «—» с флагом no_pair, это не нарушение схемы;
#   - служебная колонка «Исключённые» — устаревшие термины статьи (пометка «исключен»).
# Подключение ГОСТ Р 58624.4-2025 (2026-10-13):
#   - новая колонка источника «ГОСТ Р 58624.4-2025 (ИСО/МЭК 30107-4)» после «ГОСТ ISO/IEC 2382-37-2016»,
#     следующие колонки сдвинуты на одну;
#   - флаги объединения area_conflict, merge_candidate, name_conflict.
# Формула (2026-10-13): цепочка равенств — прямая формула, доли матрицы ошибок (formula.aliases),
#   метрики той же области; разрешена цифра «1»; все части цепочки проверяются на равенство подстановкой чисел.
# Синонимы (2026-10-13): ограничение «≤ 5» снято — в «Синонимы» все синонимы; служебная колонка
#   «Синонимы (все)» и флаг synonyms_over_limit убраны.
# Перенос в GitHub (2026-10-13):
#   - колонки источников строятся из config/merge.yaml (правило 3 prompts/add_gost.md): колонок «на будущее» нет,
#     колонка «ГОСТ Р 58624.3-2019 (ИСО/МЭК 30107-3)» убрана; порядок — как в merge.yaml;
#   - номера колонок не хранятся в схеме, их выдаёт load_schema() после раскрытия колонок источников;
#   - «Формула *»: у метрики с флагом formula_na формула не обязательна и к статусу «утвержден»;
#   - слой data/curated/ (тексты LLM и статусы человека) и флаги llm_stale, curated_orphan, formula_na, llm_failed.
# Подключение ГОСТ Р 71414.1-2024 (2026-10-13):
#   - колонка «ГОСТ Р ИСО/МЭК 19795-1-2007» переименована в «ГОСТ Р 71414.1-2024 (ИСО/МЭК 19795-1)» — заменяющий стандарт;
#   - в справочник «Область» добавлено «биометрия · идентификация»;
#   - колонки источника: допускается несколько пунктов — «п. 3.23, 3.35 — текст» (записи одного стандарта с одним ключом);
#   - правила пар метрик вынесены в pairs, добавлена пара negative ↔ positive.

version: 1
empty: "—"            # пустое значение в CSV; в JSON/SQLite — null

# Справочники. Значения вне справочника в выход не попадают.
dictionaries:
  entity_type: [метрика, термин, понятие]
  status: [черновик, утвержден, устарел, отложено]
  area:
    - биометрия · верификация
    - биометрия · защита от атак
    - биометрия · система целиком
    - биометрия · общее
    - биометрия · идентификация
  yes_no: [Да, Нет]

# Какие значения справочников вправе ставить парсер (подмножество справочника).
parser_allowed:
  entity_type: [метрика, термин]
  status: [черновик, отложено]

# required:
#   always              — обязательно
#   metric              — обязательно у метрики
#   optional            — опционально
#   for_approved        — обязательно к статусу «утвержден»
#   metric_for_approved — обязательно у метрики к статусу «утвержден»
#   none                — без требования (заполняет потребитель)
#   source              — формулировка источника: хотя бы одна такая колонка заполнена (row_rules)
# filled_by: кто заполняет в MVP — parser | llm | consumer | source (формулировка источника)
# rules — машинная форма ограничения; правило с applies_to действует только для этих типов сущности.

columns:
  - name: Наименование ru
    type: Текст
    fill: Обязательно
    required: always
    constraint: Кириллица, пробел, дефис, «», запятая; ≤ 120 символов; первая буква заглавная
    example: Вероятность ложного несовпадения
    filled_by: parser
    rules:
      - pattern: '^[А-ЯЁа-яё «»,\-]+$'
      - max_len: 120
      - first_upper: true

  - name: id
    type: Текст
    fill: Обязательно
    required: always
    constraint: ^[a-z0-9-]{1,40}$; уникален
    example: fnmr
    filled_by: parser
    rules:
      - pattern: '^[a-z0-9-]{1,40}$'
      - unique: true
    id_rule:                       # как строится id (согласовано 2026-10-13)
      source: Аббревиатура en в нижнем регистре; если её нет — slug из Наименования en (a–z, 0–9, дефис)
      max_len: 40
      too_long: обрезка по границе слова (по дефису) до ≤ max_len, флаг id_truncated
      collision: суффикс -2, -3…, флаг id_collision; уникальность проверяется после обрезки

  - name: Аббревиатура en
    type: Текст
    fill: Обязательно у метрики
    required: metric
    constraint: ^[A-Z]{2,8}$
    example: FNMR
    filled_by: parser
    rules:
      - pattern: '^[A-Z]{2,8}$'

  - name: Аббревиатура ru
    type: Текст
    fill: Опционально
    required: optional
    constraint: ^[А-ЯЁ]{2,8}$
    example: ВЛНС
    filled_by: parser
    rules:
      - pattern: '^[А-ЯЁ]{2,8}$'

  - name: Наименование en
    type: Текст
    fill: Опционально
    required: optional
    constraint: a–z, пробел, дефис; ≤ 120 символов
    example: false non-match rate
    filled_by: parser
    rules:
      - pattern: '^[a-z \-]+$'
      - max_len: 120

  - name: Область (часть ключа)
    type: Справочник
    fill: Обязательно
    required: always
    constraint: Только значение из справочника
    example: биометрия · верификация
    filled_by: parser
    rules:
      - enum: area

  - name: Тип сущности
    type: Справочник
    fill: Обязательно
    required: always
    constraint: Только значение из справочника
    example: метрика
    filled_by: parser
    rules:
      - enum: entity_type

  - name: Синонимы
    type: Список
    fill: Опционально
    required: optional
    constraint: значения через «, », без ограничения числа
    example: ЛНС, non-match rate
    filled_by: parser
    rules:
      - list: {sep: ", "}

  - source_template: true          # раскрывается в колонку на каждый стандарт из config/merge.yaml, в его порядке;
                                    # название колонки — standard.source_column из конфига стандарта
    type: Текст
    fill: см. «формулировка источника»
    required: source
    constraint: п. {номер}[, {номер}…] — {текст дословно}
    example: п. 37.09.11 — Доля завершенных попыток…
    filled_by: source
    rules:
      - pattern: '^п\. \d+(\.\d+)*(, \d+(\.\d+)*)* — \S.*$'

  - name: Ссылки для проверки
    type: Ссылки
    fill: Обязательно
    required: always
    constraint: '«{обозначение}: {url}» на каждую заполненную колонку источника, через «; »'
    example: 'ГОСТ ISO/IEC 2382-37-2016: https://files.stroyinf.ru/Data2/1/4293747/4293747566.pdf'
    filled_by: parser
    rules:
      - list: {sep: "; ", item_pattern: '^[^:]+: https?://\S+$'}
      - links_cover_sources: true      # строковое правило: по ссылке на каждую заполненную колонку источника

  - name: Переработанное длинное определение
    type: Текст
    fill: Обязательно к статусу «утвержден»
    required: for_approved
    constraint: 300–1000 символов
    example: >-
      Показывает, как часто система не узнаёт человека, который на самом деле является собой.
      Считается по сравнениям образцов одного и того же человека: сколько из них алгоритм посчитал
      несовпадающими. Пример: сотрудники 1000 раз прикладывались к турникету, 20 раз система их не
      узнала — FNMR = 2%. Чем ниже значение, тем меньше пользователь упирается в отказы. Всегда
      привязано к порогу: понизили порог — FNMR упал, но вырос FMR. В 19795-1 считается по образцам
      из попыток подлинного лица, в словаре 2382-37 — по попыткам парного сравнения
    filled_by: llm
    rules:
      - min_len: 300
      - max_len: 1000

  - name: Короткое определение
    type: Текст
    fill: Обязательно к статусу «утвержден»
    required: for_approved
    constraint: ≤ 10 слов («—» не считается словом); у метрики оканчивается на «Ниже — лучше» или «Выше — лучше»
    example: Как часто система не узнаёт своего. Ниже — лучше
    filled_by: llm
    rules:
      - max_words: {max: 10, ignore_tokens: ["—"]}
      - ends_with_any: ["Ниже — лучше", "Выше — лучше"]
        applies_to: [метрика]

  - name: Связанные термины
    type: Список
    fill: Обязательно у метрики
    required: metric
    required_exempt_flag: no_pair     # у метрики без пары допустимо «—» с флагом no_pair
    constraint: Элементы «запись — тип связи» через «. »; запись = Аббревиатура en или Наименование ru, есть в реестре; у метрики ≥ 1 «парная метрика»
    example: FMR — парная метрика
    filled_by: parser
    rules:
      - list: {sep: ". ", item_pattern: '^\S.* — \S.*$'}
      - min_link_type: {type: парная метрика, min: 1}
        applies_to: [метрика]
        exempt_flag: no_pair
      - links_exist: true              # табличное правило: запись есть в реестре (Аббревиатура en или Наименование ru)

  - name: Формула *
    type: Текст
    fill: Обязательно у метрики к статусу «утвержден»
    required: metric_for_approved
    required_exempt_flag: formula_na  # метрику нельзя выразить через TP, FP, TN, FN — формула «—»
    constraint: 'Цепочка равенств «ABBR = прямая формула [= доля матрицы ошибок] [= 1 − …]»; символы: TP, FP, TN, FN, A–Z, 1, пробел, = + − / ( ); термины — из formula.aliases или метрики той же области; все части равны'
    example: FNMR = FN / (FN + TP) = FNR = 1 − TPR
    filled_by: llm
    rules:
      - pattern: '^[A-Z1 =+−/()]+$'
      - formula_chain: true          # табличное правило: термины и равенство частей — см. раздел formula

  - name: Статус
    type: Справочник
    fill: Обязательно
    required: always
    constraint: Только значение из справочника
    example: черновик
    filled_by: parser
    rules:
      - enum: status

  - name: Есть в NIST
    type: Справочник
    fill: "—"
    required: none
    constraint: Да / Нет
    example: Да
    filled_by: consumer
    rules:
      - enum: yes_no

  - name: Забираем в MRR
    type: Справочник
    fill: "—"
    required: none
    constraint: Да / Нет
    example: Да
    filled_by: consumer
    rules:
      - enum: yes_no

# Строковые правила (по нескольким колонкам).
row_rules:
  - at_least_one_source: true        # хотя бы одна колонка с filled_by: source заполнена

# Служебные колонки выхода — после колонок 1–19, в этом порядке.
service_columns:
  - Ключ
  - Пункт
  - Раздел
  - Страница
  - Примеры
  - Примечания
  - Исключённые
  - Флаги

# Правила определения типа сущности (шаг 5) — общие для всех стандартов.
classification:
  sign_a:                      # А: аббревиатура и (…R или наименование en на «rate»)
    abbr_en_pattern: '^[A-Z]{2,8}$'
    any_of:
      - {field: abbr_en, pattern: 'R$'}
      - {field: term_en, pattern: '\brate$'}
  sign_b:                      # Б: определение начинается с этих слов, без учёта регистра
    definition_starts_with: [Доля, Вероятность, Частота, Коэффициент]
  decision:
    both:    {entity_type: метрика, status: черновик}
    one:     {entity_type: термин, status: отложено, flag: type_conflict}
    neither: {entity_type: термин, status: отложено}

# Пары метрик (шаг 7): Наименования en совпадают, кроме одного из отличий ниже.
pairs:
  - {prefix: 'non-'}                     # false match rate ↔ false non-match rate
  - {swap: [accept, reject]}             # false accept rate ↔ false reject rate
  - {swap: [negative, positive]}         # false-negative ↔ false-positive identification rate

# Флаги — каждый с объяснением для отчёта.
flags:
  header_unparsed: Заголовок статьи не разобран; сырой текст сохранён
  type_conflict: Выполнен только один из признаков метрики (А или Б) — на ручной разбор
  area_missing: Нет соответствия «раздел → Область» в конфиге стандарта
  id_collision: id совпал с уже выданным; добавлен суффикс
  no_pair: У метрики не найдена парная метрика
  ocr_suspect: Кириллица в латинском поле или латиница в кириллическом — возможная ошибка распознавания
  ocr_fixed: Применено исправление ошибки распознавания из таблицы конфига
  key_duplicate: Ключ совпадает с ключом другой записи; при объединении записи сольются в одну строку
  synonym_clash: Синоним совпадает с наименованием или синонимом другой записи; синоним не удалён
  id_truncated: Slug из Наименования en длиннее 40 символов; обрезан по границе слова
  area_conflict: Объединение — Аббревиатура en совпала, Область разная; записи не объединены
  merge_candidate: Объединение — Наименование en совпало, аббревиатура или область разные; записи не объединены
  name_conflict: Объединение — наименование другого источника отличается; оно добавлено в «Синонимы»
  llm_stale: Формулировки источников изменились после генерации текстов (отпечаток в curated-файле не совпал или отсутствует) — тексты нужно перегенерировать
  curated_orphan: Curated-файл ссылается на id, которого нет в общем реестре — файл нужно переименовать или удалить
  formula_na: Метрику нельзя выразить через TP, FP, TN, FN — формула «—»
  llm_failed: Генерация текстов не прошла проверку схемы за две попытки — поля «—», причина в отчёте PR
  hyphen_guess: Перенос дефисом в наименовании, аббревиатуре или определении угадан — слова нет в тексте стандарта ни с дефисом, ни слитно

# Формат служебной колонки «Ключ»: Аббревиатура en (или Наименование en) + Область.
key_format: '{name} | {area}'

# Проверка целостности определения (шаг 9.5) — общая для всех стандартов.
integrity:
  definition_min_len: 20
  definition_max_len: 1000
  bad_endings: ['-', ',', ':']

# Формула * — цепочка равенств. Термины цепочки: counts, aliases (общепринятые доли матрицы ошибок) и аббревиатуры
# метрик той же «Области» (их прямая формула берётся из их же колонки «Формула *»). Проверка подставляет в TP, FP, TN, FN
# наборы чисел из check_values и требует, чтобы все части цепочки были равны.
formula:
  counts: [TP, FP, TN, FN]
  aliases:
    TPR: TP / (TP + FN)        # true positive rate
    FNR: FN / (FN + TP)        # false negative rate
    FPR: FP / (FP + TN)        # false positive rate
    TNR: TN / (TN + FP)        # true negative rate
  check_values:
    - {TP: 7, FN: 3, FP: 2, TN: 11}
    - {TP: 13, FN: 5, FP: 17, TN: 19}

# Что делать с флагом — для README (раздел «Флаги»). Пояснение «когда ставится» — в flags.
flag_actions:
  header_unparsed: Разобрать заголовок вручную; при необходимости добавить ключ в конфиг стандарта
  type_conflict: Решить вручную, метрика это или термин
  area_missing: Добавить раздел в «раздел → Область» конфига стандарта
  id_collision: Проверить, не дубль ли это; при объединении id берётся из первой по priority записи
  no_pair: Ничего, если пары у метрики действительно нет; иначе — новое правило pairs по согласованию
  ocr_suspect: Сверить со сканом; ошибку распознавания добавить в таблицу corrections конфига
  ocr_fixed: Ничего — исправление записано в журнал очистки с основанием
  key_duplicate: Ничего — записи сольются в одну строку общего реестра
  synonym_clash: Проверить, не перепутаны ли термины; синоним не удаляется
  id_truncated: Ничего — id обрезан по правилу схемы
  area_conflict: Решить, какая область верна, и поправить конфиг стандарта
  merge_candidate: Решить, одна ли это метрика; при необходимости поправить область или аббревиатуру
  name_conflict: Ничего — другое наименование сохранено в «Синонимах»
  llm_stale: Перегенерировать тексты (issue «Сгенерировать тексты»)
  curated_orphan: Переименовать curated-файл под новый id или удалить его
  formula_na: Ничего — формулы у метрики нет
  llm_failed: Написать тексты вручную в curated-файле или перезапустить генерацию
  hyphen_guess: Сверить слово со сканом

# Слой data/curated/{id}.yaml — тексты LLM и статусы, которые ставит человек. Парсер туда не пишет;
# сборка подмешивает файлы только в общий реестр (data/out/registry.*). id — id строки общего реестра.
curated:
  columns: [Переработанное длинное определение, Короткое определение, Формула *, Статус]
  fingerprint_key: отпечаток          # sha256 колонок источников строки, первые 16 знаков
  flags_key: флаги
  flags: [formula_na, llm_failed]     # флаги, которые может записать генерация текстов
