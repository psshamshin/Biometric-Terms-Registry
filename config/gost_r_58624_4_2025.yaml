# Конфиг стандарта ГОСТ Р 58624.4-2025 (ИСО/МЭК 30107-4:2024, MOD).
# std_id = имя файла без .yaml. Решения по структуре согласованы на шаге 0 (2026-10-13).
# Ключи, которых нет в gost_2382_37.yaml, помечены «новый ключ»; для 2382-37 у них значения по умолчанию.

standard:
  designation: ГОСТ Р 58624.4-2025 (ИСО/МЭК 30107-4)   # = название колонки: проверка ссылок сверяет обозначение с колонкой
  source_column: ГОСТ Р 58624.4-2025 (ИСО/МЭК 30107-4)
  url: https://meganorm.ru/Data/858/85866.pdf
  pdf: data/raw/85866.pdf

numbering:
  anchor: '^3\.\d+\b'                    # статьи 3.1–3.5, групповых заголовков нет
  section: '^(\d+)\.'                    # код раздела: 3.1 → 3
  any: '\b3\.\d+\b'                      # номер статьи в тексте (проверка склейки)

bounds:
  terms:
    start: '^3\.1\b'
    end: '^4 Сокращения$'
  abbreviations:                         # новый ключ: раздел «Сокращения», строка start не входит
    start: '^В настоящем стандарте применены следующие сокращения:$'
    end: '^5 Соответствие$'
  # алфавитных указателей в стандарте нет (index_ru / index_en не заданы) — проверка полноты не выполняется

cleaning:
  repeated_line_min_share: 0.5           # колонтитул «ГОСТ Р 58624.4—2025»
  page_number: '^(\d+( \d+)?|[IVXLC]+)$'
  hyphens: ['-']
  soft_hyphen: "­"
  service_lines: []                      # внутри раздела терминов служебных строк нет

markers:
  header: '^(?P<num>\S+) (?P<head>.*?\))\s*:\s*(?P<definition>.*)$'
  example: '^Пример(ы)?( \d+)? ?— ?'
  note: '^П ?р ?и ?м ?е ?ч ?а ?н ?и ?е( \S{1,2})? ?— ?'
  synonym_marker: синоним
  excluded: '^исключен[ыа]? '
  excluded_term: '«([^»]+)»'
  abbr_ru_sep: '; '
  abbr_en_sep: null                      # английская аббревиатура — не через «, », а через «; » (см. short_forms)
  variant_sep: '/'
  short_forms:                           # новый ключ: что стоит после «; » в русском наименовании и в английских скобках
    abbr_ru: '^[А-ЯЁ]{2,8}$'             # такая строка — аббревиатура
    abbr_en: '^[A-Z]{2,8}$'
                                         # иначе — краткая форма термина → в синонимы
  qualifier:                             # новый ключ: кириллическая скобка сразу после английской — уточнение области
    note_label: 'Область применения термина: '   # пишется первым пунктом «Примечаний», в наименования не входит

abbreviations:                           # новый ключ: разбор раздела «Сокращения» → abbreviations.csv
  entry: '^(?P<abbr_ru>[^()—]+?) \((?P<abbr_en>[^()]+)\) — (?P<text>.*)$'   # начало записи; остальные строки — продолжение
  expansion_en: '^(?P<ru>.*?)(?: \((?P<en>[^()]*[A-Za-z][^()]*)\))?[;.]?$'  # английская расшифровка — последняя латинская скобка

known_ocr_errors:                        # новый ключ: известные ошибки распознавания вне статей — не исправляются, только в отчёт
  - раздел: 4 Сокращения
    было: ВДПАСпд (IAPARap)
    на_скане: ВДПАС с подстрочным ПА (IAPAR с подстрочным AP)
  - раздел: 4 Сокращения
    было: ПА (РА)
    на_скане: ПА (PA) — «РА» распознано кириллицей; по смыслу английская аббревиатура

corrections: []
header_overrides: {}

areas:
  sections:
    '3': биометрия · защита от атак
  exceptions:
    '3.5': биометрия · система целиком   # полнокомплектная биометрическая система
