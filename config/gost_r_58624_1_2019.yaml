# Конфиг стандарта ГОСТ Р 58624.1-2019 (ИСО/МЭК 30107-1:2016, MOD).
# std_id = имя файла без .yaml. Решения по структуре согласованы на шаге 0 (2026-10-13).

standard:
  designation: ГОСТ Р 58624.1-2019 (ИСО/МЭК 30107-1)   # = название колонки: проверка ссылок сверяет обозначение с колонкой
  source_column: ГОСТ Р 58624.1-2019 (ИСО/МЭК 30107-1)
  url: https://meganorm.ru/Data/722/72286.pdf
  pdf: data/raw/72286.pdf

numbering:
  anchor: '^3\.\d+\b'                    # статьи 3.1–3.7; у 3.2 и 3.3 (в рамке) номер стоит отдельной строкой
  section: '^(\d+)\.'
  any: '\b3\.\d+\b'

bounds:
  terms:
    start: '^3\.1\b'
    end: '^4 Обозначения и сокращения$'
  abbreviations:
    start: '^В настоящем стандарте использованы следующие обозначения и сокращения:$'
    end: '^5 Атаки на биометрическое предъявление$'
  # алфавитных указателей в стандарте нет — проверка полноты не выполняется

cleaning:
  repeated_line_min_share: 0.5           # колонтитул «ГОСТ Р 58624.1—2019»
  page_number: '^(\d+( \d+)?|[IVXLC]+)$'
  hyphens: ['-']
  soft_hyphen: "­"
  service_lines:                         # служебный текст внутри раздела терминов
    - '^\[ ?\d+\](, \[ ?\d+\])*\.?$'     # ссылки на библиографию «[1], [2]»
  service_fragments:                     # новый ключ: хвост строки, который убирается (номер статьи остаётся)
    - '\s+_{5,}$'                        # верх рамки у 3.2 и 3.3: «3.2 ______»

markers:
  header: '^(?P<num>\S+) (?P<head>.*?\))\s*:\s*(?P<definition>.*)$'
  example: '^Пример(ы)?( \d+)? ?— ?'
  note: '^П ?р ?и ?м ?е ?ч ?а ?н ?и ?е( \S{1,2})? ?— ?'
  synonym_marker: синоним
  excluded: '^исключен[ыа]? '
  excluded_term: '«([^»]+)»'
  abbr_ru_sep: '; '
  abbr_en_sep: null                      # английская аббревиатура — после «; » внутри скобок (short_forms)
  variant_sep: '/'
  short_forms:
    abbr_ru: '^[А-ЯЁ]{2,8}$'
    abbr_en: '^[A-Z]{2,8}$'
  example_list:                          # новый ключ: «Примеры» + пункты «1 …», «2 …» на отдельных строках
    heading: '^Примеры$'
    item: '^\d+ '
  note_list:
    heading: '^П ?р ?и ?м ?е ?ч ?а ?н ?и ?я$'
    item: '^\d+ '

abbreviations:
  entry: '^(?P<abbr_ru>[А-ЯЁ]{2,8}) — (?P<text>.*)$'            # только русские сокращения
  expansion_en: '^(?P<ru>.*?)(?: \((?P<en>[^()]*[A-Za-z][^()]*)\))?[;.]?$'

corrections: []                          # сверено со сканом стр. PDF 6–7: ошибок распознавания в статьях нет
header_overrides: {}

amendments:                              # новый ключ: правка статьи по «Изменению № …» (приложено к PDF, стр. 17); флаг amended
  - пункт: '3.5'
    изменение: Изменение № 1 (Приказ Росстандарта от 14.11.2022 № 1280-ст, ИУС № 2 2023)
    было: 'attack): Биометрическое предъявление'
    стало: 'attack): Предъявление инструмента атаки на биометрическое предъявление'
    основание: стр. PDF 17, скан сверен — п. 3.5 в новой редакции (кроме примечаний); заголовок и «Примечания» не менялись

areas:
  sections:
    '3': биометрия · защита от атак
  exceptions: {}
