# Конфиг стандарта ГОСТ Р 71414.1-2024 (ИСО/МЭК 19795-1:2021, MOD), взамен ГОСТ Р ИСО/МЭК 19795-1-2007.
# std_id = имя файла без .yaml. Решения по структуре согласованы на шаге 0 (2026-10-13).
# Новые ключи разбора: markers.groups, markers.parameters, markers.note_list.

standard:
  designation: ГОСТ Р 71414.1-2024 (ИСО/МЭК 19795-1)   # = название колонки (переименована из 19795-1-2007)
  source_column: ГОСТ Р 71414.1-2024 (ИСО/МЭК 19795-1)
  url: https://meganorm.ru/Data/836/83617.pdf
  pdf: data/raw/83617.pdf

numbering:
  anchor: '^3\.\d+\b'
  section: '^(\d+)\.'
  any: '\b3\.\d+\b'

bounds:
  terms:
    start: '^3\.1\b'
    end: '^4 Сокращения$'
  abbreviations:
    start: '^В настоящем стандарте применены следующие сокращения:$'
    end: '^5 Соответствие$'
  # алфавитных указателей нет — проверка полноты не выполняется

cleaning:
  repeated_line_min_share: 0.5           # колонтитул «ГОСТ Р 71414.1—2024»
  page_number: '^(\d+( \d+)?|[IVXLC]+)$'
  hyphens: ['-']
  soft_hyphen: "­"
  service_lines: []

markers:
  header: '^(?P<num>\S+) (?P<head>.*?[)\]])\s*:\s*(?P<definition>.*)$'   # заголовок — до первого «): » или «]: »
  example: '^Пример(ы)?( \d+)? ?— ?'
  note: '^П ?р ?и ?м ?е ?ч ?а ?н ?и ?е( \S{1,2})? ?— ?'
  synonym_marker: синоним
  excluded: '^исключен[ыа]? '
  excluded_term: '«([^»]+)»'
  abbr_ru_sep: '; '
  abbr_en_sep: null
  variant_sep: '/'
  short_forms:
    abbr_ru: '^[А-ЯЁ]{2,8}$'
    abbr_en: '^[A-Z]{2,8}$'
  groups: {'(': ')', '[': ']'}           # новый ключ: английская группа бывает в квадратных скобках (внутри — свои скобки)
  parameters:                            # новый ключ: обозначение с параметрами «ВЛОИ (N, R, T)» — не синоним
    pattern: '^[A-Z](, [A-Z])*$'         # содержимое скобки с параметрами
    note_label: 'Обозначение с параметрами: '   # первым пунктом «Примечаний»
  note_list:                             # новый ключ: «П р и м е ч а н и я» + пункты «1 …», «2 …» на отдельных строках
    heading: '^П ?р ?и ?м ?е ?ч ?а ?н ?и ?я$'
    item: '^\d+ '

abbreviations:
  entry: '^(?P<abbr_ru>[А-ЯЁ]{2,8}) — (?P<text>.*)$'            # только русские сокращения
  expansion_en: '^(?P<ru>.*?)(?: \((?P<en>[^()]*[A-Za-z][^()]*)\))?[;.]?$'

# Ошибки распознавания: сверены со сканом всех 35 статей (стр. PDF 6–9). Курсивные N, T, k распознаны
# как «Л/», «А/», «Т»/«Г» (кириллица), «/с», «к»; конец заголовка «]:» — как «\:», «\\», «]\».
# Строки «было» — после склейки переносов и схлопывания пробелов.
corrections:
  - пункт: '3.22'
    было: '(Л/, R, Т) [false-negative identification rate; FNIR; FNIR (А/, R, T)\:'
    стало: '(N, R, T) [false-negative identification rate; FNIR; FNIR (N, R, T)]:'
    основание: скан стр. 7 — «(N, R, T) [… FNIR (N, R, T)]:», курсивные латинские N, T
  - пункт: '3.22'
    было: 'и порога принятия решения Г, которому'
    стало: 'и порога принятия решения T, которому'
    основание: скан стр. 7, примечание — курсивное T
  - пункт: '3.23'
    было: '(А/, Т) [false-positive identification rate; FPIR; FPIR (А/, T)\\'
    стало: '(N, T) [false-positive identification rate; FPIR; FPIR (N, T)]:'
    основание: скан стр. 7 — «(N, T) [… FPIR (N, T)]:»
  - пункт: '3.23'
    было: 'А/, а также от порога принятия решения Г,'
    стало: 'N, а также от порога принятия решения T,'
    основание: скан стр. 7, примечание 1 — курсивные N, T
  - пункт: '3.24'
    было: 'Наименьшее значение /с, для которого'
    стало: 'Наименьшее значение k, для которого'
    основание: скан стр. 8 — курсивное k
  - пункт: '3.24'
    было: 'в первых к идентификаторах'
    стало: 'в первых k идентификаторах'
    основание: скан стр. 8 — курсивное латинское k (не предлог «к»)
  - пункт: '3.24'
    было: '«ранг к из п»'
    стало: '«ранг k из n»'
    основание: скан стр. 8, примечание — «ранг k из n», латиница
  - пункт: '3.25'
    было: 'ВИПИ (А/, R, Т) [truepositive identification rate; TPIR; TPIR (Л/, R, T)]:'
    стало: 'ВИПИ (N, R, T) [true-positive identification rate; TPIR; TPIR (N, R, T)]:'
    основание: скан стр. 8 — «(N, R, T) [true-positive …]»; дефис в «true-» на конце строки распознан мягким переносом
  - пункт: '3.25'
    было: 'А/, а также от параметров'
    стало: 'N, а также от параметров'
    основание: скан стр. 8, примечание 1 — курсивное N
  - пункт: '3.25'
    было: 'решения Т, которому'
    стало: 'решения T, которому'
    основание: скан стр. 8, примечание 1 — курсивное латинское T (в тексте кириллица)
  - пункт: '3.25'
    было: 'Сумма ВИПИ (Л/, R, Т) и ВПОИ (Л/, R, Т)'
    стало: 'Сумма ВИПИ (N, R, T) и ВЛОИ (N, R, T)'
    основание: скан стр. 8, примечание 2 — «ВИПИ (N, R, T) и ВЛОИ (N, R, T)»
  - пункт: '3.26'
    было: 'СЕЛ (Л/, R, Т) [selectivity; SEL (А/, Т)]\'
    стало: 'СЕЛ (N, R, T) [selectivity; SEL (N, T)]:'
    основание: скан стр. 8 — «СЕЛ (N, R, T) [selectivity; SEL (N, T)]:»
  - пункт: '3.26'
    было: 'решения Г, при непарном поиске'
    стало: 'решения T, при непарном поиске'
    основание: скан стр. 8, определение — курсивное T
  - пункт: '3.26'
    было: 'субъектов А/, а также'
    стало: 'субъектов N, а также'
    основание: скан стр. 8, примечание 1 — курсивное N
  - пункт: '3.26'
    было: 'решения Г, которому'
    стало: 'решения T, которому'
    основание: скан стр. 8, примечание 1 — курсивное T
  - пункт: '3.26'
    было: 'субъектов А/, то'
    стало: 'субъектов N, то'
    основание: скан стр. 8, примечание 2 — курсивное N
  - пункт: '3.35'
    было: '(N, Т) [false-positive'
    стало: '(N, T) [false-positive'
    основание: скан стр. 9 — латинское T, как в английской части; в тексте кириллица
  - пункт: '3.35'
    было: 'решения Т, которому'
    стало: 'решения T, которому'
    основание: скан стр. 9, примечание — латинское T (в тексте кириллица)
header_overrides: {}

areas:
  sections:
    '3': биометрия · общее
  exceptions:
    '3.19': биометрия · система целиком     # failure to acquire — как 37.09.03 в 2382-37
    '3.20': биометрия · система целиком     # FRR — по транзакциям
    '3.21': биометрия · система целиком     # FAR — по транзакциям
    '3.27': биометрия · система целиком     # computational workload
    '3.28': биометрия · верификация         # DET
    '3.33': биометрия · верификация         # FNMR
    '3.34': биометрия · верификация         # FMR
    '3.10': биометрия · идентификация       # новое значение справочника
    '3.22': биометрия · идентификация       # FNIR
    '3.23': биометрия · идентификация       # FPIR
    '3.24': биометрия · идентификация       # rank
    '3.25': биометрия · идентификация       # TPIR
    '3.26': биометрия · идентификация       # SEL
