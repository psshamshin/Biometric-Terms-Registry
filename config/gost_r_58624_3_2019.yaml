# Конфиг стандарта ГОСТ Р 58624.3-2019 (ИСО/МЭК 30107-3:2017, MOD).
# std_id = имя файла без .yaml. Решения по структуре — шаг 0 (2026-10-16), сверено со сканом стр. PDF 10–13.

standard:
  designation: ГОСТ Р 58624.3-2019 (ИСО/МЭК 30107-3)   # = название колонки: проверка ссылок сверяет обозначение с колонкой
  source_column: ГОСТ Р 58624.3-2019 (ИСО/МЭК 30107-3)
  url: https://meganorm.ru/Data/730/73035.pdf
  pdf: data/raw/73035.pdf

numbering:
  anchor: '^3\.\d+\.\d+\b'               # статьи 3.1.1–3.1.9, 3.2.1–3.2.12; «3.1 Элементы атаки», «3.2 Метрики» — заголовки подразделов
  section: '^(\d+\.\d+)\.'               # код раздела: 3.1.1 → 3.1
  any: '\b3\.\d+\.\d+\b'

bounds:
  terms:
    start: '^3\.1\.1\b'
    end: '^4 Сокращения$'
  abbreviations:
    start: '^В настоящем стандарте использованы следующие сокращения:$'
    end: '^5 Соответствие$'
  # алфавитных указателей в стандарте нет — проверка полноты не выполняется

cleaning:
  repeated_line_min_share: 0.5           # колонтитул «ГОСТ Р 58624.3—2019»
  page_number: '^(\d+( \d+)?|[IVXLC]+)$'
  hyphens: ['-']
  soft_hyphen: "­"
  service_lines:                         # служебный текст внутри раздела терминов
    - '^\* ИТ — информационные технологии \(Information technology, IT\)\.$'   # сноска к 3.1.8
    - '^3\.[12] [А-ЯЁ][а-яё]+( [а-яё]+)*$'   # заголовки подразделов «3.1 Элементы атаки», «3.2 Метрики»
  service_fragments:
    - '(?<=[а-я])\*(?=,)'                # знак сноски «технологий*,» в 3.1.8

markers:
  header: '^(?P<num>\S+) (?P<head>.*?\))\s*:\s*(?P<definition>.*)$'
  example: '^Пример(ы)?( \d+)? ?— ?'
  note: '^П ?р ?и ?м ?е ?ч ?а ?н ?и ?е( \S{1,2})? ?— ?'
  synonym_marker: синоним
  excluded: '^исключен[ыа]? '
  excluded_term: '«([^»]+)»'
  abbr_ru_sep: '; '
  abbr_en_sep: ', '                      # «(attack presentation classification error rate, APCER)»
  variant_sep: '/'
  short_forms:                           # «(item under test; IUT)», «(PAD subsystem processing duration; PS-PD)»
    abbr_ru: '^[А-ЯЁ]{2,8}$'
    abbr_en: '^[A-Z]{2,8}$'
  qualifier:                             # «(оценка полнокомплектной биометрической системы верификации)» после английской скобки
    note_label: 'Область применения термина: '
  example_list:
    heading: '^Примеры$'
    item: '^\d+ '
  note_list:
    heading: '^П ?р ?и ?м ?е ?ч ?а ?н ?и ?я$'
    item: '^\d+ '

abbreviations:
  entry: '^(?P<abbr_ru>[^()—]+?) \((?P<abbr_en>[^()]+)\) — (?P<text>.*)$'
  expansion_en: '^(?P<ru>.*?)(?: \((?P<en>[^()]*[A-Za-z][^()]*)\))?[;.]?$'

known_ocr_errors:                        # ошибки распознавания вне статей — не исправляются, только в отчёт
  - раздел: 4 Сокращения
    было: 0 0 (TOE)
    на_скане: ОО (TOE) — кириллические «ОО»
  - раздел: 4 Сокращения
    было: П30П0П (FSDPP)
    на_скане: ПЗОПОП (FSDPP) — буквы «З» и «О» распознаны цифрами

corrections:
  - пункт: '3.1.8'
    было: '0 0 (target'
    стало: 'ОО (target'
    основание: скан стр. 10 (полоса p11_01) — «ОО (target of evaluation, TOE)», кириллические буквы; в тексте распознаны цифрами «0 0»

header_overrides: {}

areas:
  sections:
    '3.1': биометрия · защита от атак
    '3.2': биометрия · защита от атак
  exceptions:
    '3.2.6': биометрия · верификация       # IAPMR — оценка полнокомплектной системы верификации
    '3.2.7': биометрия · верификация       # CAPNMR — то же
    '3.2.8': биометрия · идентификация     # IAPIR — оценка полнокомплектной системы идентификации
    '3.2.9': биометрия · идентификация     # CAPNIR — то же
    '3.2.12': биометрия · система целиком  # длительность обработки полнокомплектной системы
