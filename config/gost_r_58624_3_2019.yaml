# Конфиг стандарта ГОСТ Р 58624.3-2019 (ИСО/МЭК 30107-3:2017, MOD).
# std_id = имя файла без .yaml. Решения по структуре согласованы на шаге 0 (2026-10-16).

standard:
  designation: ГОСТ Р 58624.3-2019 (ИСО/МЭК 30107-3)   # = название колонки: проверка ссылок сверяет обозначение с колонкой
  source_column: ГОСТ Р 58624.3-2019 (ИСО/МЭК 30107-3)
  url: https://meganorm.ru/Data/730/73035.pdf
  pdf: data/raw/73035.pdf

numbering:
  anchor: '^3\.\d+\.\d+\b'               # статьи 3.1.1–3.1.9 и 3.2.1–3.2.12; подзаголовки 3.1, 3.2 — служебные строки
  section: '^(\d+\.\d+)\.'               # код подраздела: 3.1.1 → 3.1 (порядок и пропуски проверяются внутри подраздела)
  any: '\b3\.\d+\.\d+\b'                 # номер статьи в тексте (проверка склейки)

bounds:
  terms:
    start: '^3\.1\.1\b'
    end: '^4 Сокращения$'
  abbreviations:
    start: '^В настоящем стандарте использованы следующие сокращения:$'
    end: '^5 Соответствие$'
  # алфавитных указателей в стандарте нет — проверка полноты не выполняется

cleaning:
  repeated_line_min_share: 0.5           # колонтитул «ГОСТ Р 58624.3—2019»
  page_number: '^(\d+( \d+)?|[IVXLC]+)$'
  hyphens: ['-']
  soft_hyphen: "­"
  footnote_lines:                        # новый ключ: сноска внизу страницы (убирается до склейки переносов)
    - '^\* ИТ — информационные технологии \(Information technology, IT\)\.$'
  service_lines:                         # заголовки подразделов
    - '^3\.[12] (Элементы атаки|Метрики)$'
  service_fragments:                     # знак сноски «*» в тексте
    - '\*'

markers:
  header: '^(?P<num>\S+) (?P<head>.*?\))\s*:\s*(?P<definition>.*)$'
  example: '^Пример(ы)?( \d+)? ?— ?'
  note: '^П ?р ?и ?м ?е ?ч ?а ?н ?и ?е( \S{1,2})? ?— ?'
  synonym_marker: синоним
  excluded: '^исключен[ыа]? '
  excluded_term: '«([^»]+)»'
  abbr_ru_sep: '; '
  abbr_en_sep: ', '                      # «(target of evaluation, TOE)»; где аббревиатура после «; » — short_forms
  variant_sep: '/'
  short_forms:
    abbr_ru: '^[А-ЯЁ][А-ЯЁа-яё0-9-]{1,7}$'   # ВНсПАУ — строчные буквы внутри
    abbr_en: '^[A-Z][A-Za-z0-9-]{1,7}$'      # PS-PD — дефис
  qualifier:                             # кириллическая скобка после английской — уточнение области
    note_label: 'Область применения термина: '
  example_list:
    heading: '^Примеры$'
    item: '^\d+ '
  note_list:
    heading: '^П ?р ?и ?м ?е ?ч ?а ?н ?и ?я$'
    item: '^\d+ '

abbreviations:
  entry: '^(?P<abbr_ru>[^()—]+?) \((?P<abbr_en>[^()]+)\) — (?P<text>.*)$'
  expansion_en: '^(?P<ru>.*?)(?: \((?P<en>[^()]*[A-Za-z][^()]*)\))?[;.]?$'

known_ocr_errors:                        # вне статей — не исправляются, только в отчёт
  - раздел: 4 Сокращения
    было: 0 0 (TOE)
    на_скане: ОО (TOE) — «ОО» распознано цифрами
  - раздел: 4 Сокращения
    было: П30П0П (FSDPP)
    на_скане: ПЗОПОП (FSDPP) — скан стр. PDF 13 (p13_01.png); «ЗО» и «О» распознаны цифрами

corrections:
  - пункт: '3.1.8'
    было: 0 0 (target
    стало: ОО (target
    основание: скан стр. PDF 11 (p11_01.png) — «ОО» кириллицей, в текстовом слое цифры «0 0»

header_overrides: {}

areas:
  sections:
    '3.1': биометрия · защита от атак
    '3.2': биометрия · защита от атак
  exceptions:
    '3.2.6': биометрия · верификация
    '3.2.7': биометрия · верификация
    '3.2.8': биометрия · идентификация
    '3.2.9': биометрия · идентификация
    '3.2.12': биометрия · система целиком
