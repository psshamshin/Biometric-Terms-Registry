# Конфиг стандарта ГОСТ ISO/IEC 2382-37-2016. Всё, что зависит от конкретного стандарта, — здесь.
# Решения по структуре согласованы на шаге 0 (2026-10-13).

standard:
  designation: ГОСТ ISO/IEC 2382-37-2016          # обозначение в «Ссылках для проверки»
  source_column: ГОСТ ISO/IEC 2382-37-2016        # колонка «формулировки источника» из registry_schema.yaml
  url: https://files.stroyinf.ru/Data2/1/4293747/4293747566.pdf
  pdf: data/raw/4293747566.pdf

numbering:
  anchor: '^37\.\d{2}\.\d{2}\b'          # номер статьи в начале строки
  section: '^(\d+\.\d+)\.'               # код раздела из номера: 37.09.11 → 37.09
  any: '\b37\.\d{2}\.\d{2}\b'                # номер статьи в любом месте текста (проверка склейки)

# Границы фрагментов документа — по строкам (после удаления колонтитулов, без учёта отступов).
bounds:
  terms:
    start: '^37\.01\.01\b'                                    # первая статья, строка входит в раздел
    end: '^Алфавитный указатель терминов на русском языке$'   # заголовок указателя, не входит
  index_ru:
    start: '^Алфавитный указатель терминов на русском языке$'
    end: '^Алфавитный указатель терминов на английском языке$'
  index_en:
    start: '^Алфавитный указатель терминов на английском языке$'
    end: '^Библиография$'

cleaning:
  repeated_line_min_share: 0.5             # колонтитул — строка (без учёта пробелов) на ≥ 50% страниц
  page_number: '^(\d+( \d+)?|[IVXLC]+)$'   # последняя непустая строка страницы; «1 2» — распознанное «12»
  hyphens: ['-']                           # перенос дефисом: склеивать, если следующая строка со строчной
  soft_hyphen: "­"                    # мягкий перенос: в конце строки склеивать, внутри строки удалять
  service_lines:                           # служебные строки внутри раздела терминов
    - '^Издание официальное$'
    - '^3\.\d+ (Общие термины|Термины, связанные .+)$'

# Разбор статьи.
markers:
  header: '^(?P<num>\S+) (?P<head>.*?\))\s*:\s*(?P<definition>.*)$'   # заголовок — до первого «): »
  example: '^Пример(ы)?( \d+)? ?— ?'
  note: '^П ?р ?и ?м ?е ?ч ?а ?н ?и ?е( \S{1,2})? ?— ?'   # номер по порядку появления, не по распознанной цифре
  synonym_marker: синоним                  # группа «(синоним)»
  excluded: '^исключен[ыа]? '              # «исключен «...»» внутри английских скобок
  excluded_term: '«([^»]+)»'
  abbr_ru_sep: '; '
  abbr_en_sep: ', '
  variant_sep: '/'

# Ошибки распознавания текстового слоя: пункт → было → стало. Всё, чего нет в таблице, не исправляется.
corrections:
  - пункт: 37.01.03
    было: biometric гесодпШоп
    стало: biometric recognition
    основание: кириллица вместо латиницы; английский указатель — «biometric recognition»
  - пункт: 37.03.14
    было: biometric ргоЬе
    стало: biometric probe
    основание: кириллица вместо латиницы; английский указатель — «biometric probe»
  - пункт: 37.05.02
    было: представление^)
    стало: представление(я)
    основание: «^)» — распознанное «(я)»

# Явный порядок английских вариантов заголовка (перестановка, а не замена: множество должно совпасть).
header_overrides:
  37.05.14:
    en_variants: [filter, threshold]       # основное — «filter» (по смыслу «фильтровать»), «threshold» — в синонимы

# Область: раздел → значение справочника; исключения — по номеру пункта.
areas:
  sections:
    '37.01': биометрия · общее
    '37.02': биометрия · система целиком
    '37.03': биометрия · общее
    '37.04': биометрия · система целиком
    '37.05': биометрия · система целиком
    '37.06': биометрия · общее
    '37.07': биометрия · общее
    '37.08': биометрия · общее
    '37.09': биометрия · верификация
  exceptions:
    '37.09.03': биометрия · система целиком   # отказ получения биометрических данных
    '37.09.04': биометрия · система целиком   # FTA
    '37.09.05': биометрия · система целиком   # отказ сбора биометрических данных
    '37.09.06': биометрия · система целиком   # отказ биометрической регистрации
    '37.09.07': биометрия · система целиком   # FTE

# Сверка с алфавитными указателями.
index:
  entry: '^(?P<term>.+?) (?P<num>\d+\.\d+\.+\d+)$'   # номер в указателе распознан как «37.05..05»
  ru_word_order_free: true                            # в русском указателе слова переставлены
  known_gaps:                                         # объяснённые расхождения
    - пункт: 37.04.01
      термин: биометрический сканер
      указатель: ru
      причина: синоним отсутствует в русском указателе стандарта
    - пункт: 37.03.22
      термин: контрольный набор биометрических признаков
      указатель: ru
      причина: синоним отсутствует в русском указателе стандарта
    - пункт: 37.05.09                  # термин статьи, которого нет в указателе
      термин: промежуточная обработка биометрического образца
      указатель: ru
      причина: 'в указателе стандарта другая формулировка термина: «обработка промежуточного биометрического образца»'
    - пункт: 37.05.09                  # запись указателя, которой нет в статье; в синонимы не добавляется
      термин: обработка промежуточного биометрического образца
      указатель: ru
      причина: 'в указателе стандарта другая формулировка термина: «обработка промежуточного биометрического образца»'
